[package]
name = "solana-sniper-bot"
version = "0.1.0"
edition = "2024"
description = "Solana sniper bot for X/Twitter signals on the TweetStream real-time feed."
license = "MIT"
homepage = "https://tweetstream.io/?utm_source=github&utm_medium=referral&utm_campaign=solana-sniper-bot&utm_content=cargo"
repository = "https://github.com/tweetstream-io/solana-sniper-bot"
publish = false

[dependencies]
base64 = "0.23"
bs58 = "0.5"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jsonschema = { version = "0.58", default-features = false }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
solana-compute-budget-interface = "3.1"
solana-hash = { version = "4.7", features = ["decode"] }
solana-instruction = "4.0"
solana-keypair = "4.0"
solana-message = { version = "5.1", features = ["wincode"] }
solana-pubkey = { version = "4.4", features = ["curve25519", "sha2"] }
solana-signature = "3.6"
solana-signer = "4.0"
solana-system-interface = { version = "3.3", features = ["wincode"] }
solana-transaction = { version = "5.1", features = ["wincode"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
wincode = "0.6"

[[bench]]
name = "hot_path"
harness = false
