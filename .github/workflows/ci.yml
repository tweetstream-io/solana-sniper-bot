name: ci

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The demo feed is ts/scripts/demo-feed.ts.
      - run: npm ci
        working-directory: ts
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      # Both demos replay the same feed, so their decisions must match line for line. Timestamps,
      # timing lines, and the post ids the feed derives from the clock are left out.
      - name: Compare demo decisions with the TypeScript bot
        working-directory: .
        run: |
          decisions() { grep -E '^[0-9:.]+ (signal|fire|skip|exit) ' | sed -E 's/^[0-9:.]+ //; s/twitter:[0-9]+/twitter:ID/g'; }
          (cd ts && npm run --silent demo) 2>&1 | decisions > ts-decisions.txt
          rust/target/release/solana-sniper-bot --demo 2>&1 | decisions > rust-decisions.txt
          test -s ts-decisions.txt
          diff ts-decisions.txt rust-decisions.txt
